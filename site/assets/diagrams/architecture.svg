<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Raziel architecture</title>
  <desc id="arch-desc">A Go adapter reads the SpiceDB schema for compilation into Rust PolicyIR. Approved policy and signed snapshot records are available through a trusted registry. The owner commits relationship data in a snapshot and builds a private witness. The local prover runs the Rust SP1 guest with approved policy and private witness data. The separate TypeScript SDK receives a proof-backed grant and sends a signed request with the capability. The Next.js gateway uses an independent Rust verifier and checks the request before reading protected data.</desc>
