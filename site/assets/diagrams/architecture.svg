    <marker id="arch-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse">
      <path d="M0 0 6 3 0 6Z" fill="#0B5947"/>
    </marker>
  </defs>
  <rect width="820" height="500" fill="#F7FAF8"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#101A17">
    <text x="28" y="52" font-size="32" font-weight="700">Raziel architecture</text>
    <text x="28" y="81" font-size="17" fill="#40564E">Compile policy, prove permission, and enforce scoped reads.</text>
    <path d="M28 98H792" stroke="#C9D7D0"/>

    <rect x="20" y="232" width="576" height="113" rx="8" fill="#E7F2EC" stroke="#B5CFC2"/>
